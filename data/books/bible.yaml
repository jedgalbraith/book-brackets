schema_version: "1"
root:
  slug: bible
  type: volume
  title: Bible
  description: >
    The Bible is a collection of sacred texts central to Judaism and Christianity.
    It is divided into the Old Testament, recording God's covenants with Israel,
    and the New Testament, recounting the life and teachings of Jesus Christ.
  children:
    - slug: old-testament
      type: testament
      title: Old Testament
      description: The Old Testament contains the sacred writings of ancient Israel, including the law, history, poetry, and prophecy.
      children:
        - slug: genesis
          type: book
          title: Genesis
          description: Genesis records the creation of the world, the fall of man, and the foundational stories of the patriarchs.
          url_template: "https://www.churchofjesuschrist.org/study/scriptures/ot/gen/{index}?lang=eng"
          children:
            - slug: genesis-1
              type: chapter
              description: God creates the heavens and the earth in six days.
            - slug: genesis-2
              type: chapter
              description: "The creation of man and woman; the garden of Eden."
            - slug: genesis-3
              type: chapter
              description: "The fall of Adam and Eve; they are cast out of Eden."
            - slug: genesis-4
              type: chapter
              description: "Cain slays Abel; genealogy from Adam."
            - slug: genesis-5
              type: chapter
              description: Generations from Adam to Noah.
            - slug: genesis-6
              type: chapter
              description: "Wickedness of man; Noah instructed to build the ark."
            - slug: genesis-7
              type: chapter
              description: "The flood; Noah and his family preserved in the ark."
            - slug: genesis-8
              type: chapter
              description: "The waters recede; Noah's sacrifice; God's promise."
            - slug: genesis-9
              type: chapter
              description: "God's covenant with Noah; the rainbow as a sign."
            - slug: genesis-10
              type: chapter
              description: Table of nations — descendants of Noah's sons.
            - slug: genesis-11
              type: chapter
              description: "The tower of Babel; genealogy from Shem to Abram."
            - slug: genesis-12
              type: chapter
              description: "Abram called by God; he goes to Canaan and Egypt."
            - slug: genesis-13
              type: chapter
              description: "Abram and Lot separate; Abram settles at Hebron."
            - slug: genesis-14
              type: chapter
              description: "Abram rescues Lot; Melchizedek blesses Abram."
            - slug: genesis-15
              type: chapter
              description: "God's covenant with Abram; the promised seed and land."
            - slug: genesis-16
              type: chapter
              description: "Hagar and the birth of Ishmael."
            - slug: genesis-17
              type: chapter
              description: "Covenant of circumcision; Abram renamed Abraham."
            - slug: genesis-18
              type: chapter
              description: "The Lord visits Abraham; promise of Isaac; Abraham pleads for Sodom."
            - slug: genesis-19
              type: chapter
              description: "Destruction of Sodom and Gomorrah; Lot saved."
            - slug: genesis-20
              type: chapter
              description: Abraham and Abimelech at Gerar.
            - slug: genesis-21
              type: chapter
              description: "Birth of Isaac; Hagar and Ishmael sent away."
            - slug: genesis-22
              type: chapter
              description: "The sacrifice of Isaac; Abraham's faith tested."
            - slug: genesis-23
              type: chapter
              description: "Death and burial of Sarah."
            - slug: genesis-24
              type: chapter
              description: "A wife sought for Isaac; Rebekah chosen."
            - slug: genesis-25
              type: chapter
              description: "Death of Abraham; birth of Esau and Jacob; Esau sells his birthright."
            - slug: genesis-26
              type: chapter
              description: "Isaac and the Philistines; covenant renewed."
            - slug: genesis-27
              type: chapter
              description: "Jacob obtains Isaac's blessing by deceit."
            - slug: genesis-28
              type: chapter
              description: "Jacob flees to Laban; vision of the ladder at Bethel."
            - slug: genesis-29
              type: chapter
              description: "Jacob serves Laban; marries Leah and Rachel."
            - slug: genesis-30
              type: chapter
              description: "Birth of Jacob's twelve children; Jacob's flocks increase."
            - slug: genesis-31
              type: chapter
              description: "Jacob departs from Laban; covenant at Mizpah."
            - slug: genesis-32
              type: chapter
              description: "Jacob prepares to meet Esau; wrestles with an angel and is named Israel."
            - slug: genesis-33
              type: chapter
              description: "Jacob meets Esau in peace; they part amicably."
            - slug: genesis-34
              type: chapter
              description: "Dinah and the Shechemites; Simeon and Levi avenge her."
            - slug: genesis-35
              type: chapter
              description: "Jacob returns to Bethel; God appears; Rachel dies; Isaac dies."
            - slug: genesis-36
              type: chapter
              description: Descendants and kings of Esau (Edom).
            - slug: genesis-37
              type: chapter
              description: "Joseph's dreams of ruling his brothers; sold into Egypt."
            - slug: genesis-38
              type: chapter
              description: "Judah and Tamar."
            - slug: genesis-39
              type: chapter
              description: "Joseph in Potiphar's house; resists temptation; imprisoned."
            - slug: genesis-40
              type: chapter
              description: "Joseph interprets the dreams of Pharaoh's butler and baker."
            - slug: genesis-41
              type: chapter
              description: "Joseph interprets Pharaoh's dreams; appointed ruler over Egypt."
            - slug: genesis-42
              type: chapter
              description: "Joseph's brothers come to Egypt for grain; Joseph tests them."
            - slug: genesis-43
              type: chapter
              description: "Benjamin brought to Egypt; brothers dine with Joseph."
            - slug: genesis-44
              type: chapter
              description: "Joseph's silver cup planted; Judah pleads for Benjamin."
            - slug: genesis-45
              type: chapter
              description: "Joseph reveals himself to his brothers; invites family to Egypt."
            - slug: genesis-46
              type: chapter
              description: "Jacob and family journey to Egypt; Jacob meets Pharaoh."
            - slug: genesis-47
              type: chapter
              description: "Jacob's family settles in Goshen; Joseph manages the famine."
            - slug: genesis-48
              type: chapter
              description: "Jacob blesses Ephraim and Manasseh."
            - slug: genesis-49
              type: chapter
              description: "Jacob's final blessings and prophecies over his twelve sons."
            - slug: genesis-50
              type: chapter
              description: "Death and burial of Jacob; Joseph forgives his brothers; death of Joseph."

        - slug: exodus
          type: book
          title: Exodus
          description: Exodus records Israel's deliverance from Egyptian slavery through Moses, the giving of the law at Sinai, and the construction of the tabernacle.
          url_template: "https://www.churchofjesuschrist.org/study/scriptures/ot/ex/{index}?lang=eng"
          children:
            - slug: exodus-1
              type: chapter
              description: "Israelites multiply in Egypt; Pharaoh oppresses them with forced labor."
            - slug: exodus-2
              type: chapter
              description: "Birth and early life of Moses; he flees to Midian."
            - slug: exodus-3
              type: chapter
              description: "Moses and the burning bush; God reveals his name and mission."
            - slug: exodus-4
              type: chapter
              description: "Signs given to Moses; Aaron appointed as his spokesman."
            - slug: exodus-5
              type: chapter
              description: "Moses and Aaron before Pharaoh; Israel's burdens are increased."
            - slug: exodus-6
              type: chapter
              description: "God renews the covenant with Moses; genealogy of Moses and Aaron."
            - slug: exodus-7
              type: chapter
              description: "Moses and Aaron before Pharaoh; the Nile turned to blood."
            - slug: exodus-8
              type: chapter
              description: "The plagues of frogs, lice, and flies."
            - slug: exodus-9
              type: chapter
              description: "The plagues on livestock, boils, and hail."
            - slug: exodus-10
              type: chapter
              description: "The plagues of locusts and darkness."
            - slug: exodus-11
              type: chapter
              description: "The final plague announced — death of the firstborn."
            - slug: exodus-12
              type: chapter
              description: "The Passover instituted; the exodus from Egypt."
            - slug: exodus-13
              type: chapter
              description: "Consecration of the firstborn; the pillar of cloud and fire."
            - slug: exodus-14
              type: chapter
              description: "Crossing the Red Sea; the Egyptian army destroyed."
            - slug: exodus-15
              type: chapter
              description: "The song of Moses; Miriam's song; bitter waters at Marah."
            - slug: exodus-16
              type: chapter
              description: "Manna and quail provided in the wilderness."
            - slug: exodus-17
              type: chapter
              description: "Water from the rock at Horeb; Amalek defeated."
            - slug: exodus-18
              type: chapter
              description: "Jethro visits Moses; a system of judges appointed."
            - slug: exodus-19
              type: chapter
              description: "Israel at Mount Sinai; God descends in fire and thunder."
            - slug: exodus-20
              type: chapter
              description: "The Ten Commandments given to Israel."
            - slug: exodus-21
              type: chapter
              description: "Laws concerning servants, personal injury, and restitution."
            - slug: exodus-22
              type: chapter
              description: "Laws concerning theft, property, and social responsibility."
            - slug: exodus-23
              type: chapter
              description: "Laws of justice and mercy; three annual feasts; the promised land."
            - slug: exodus-24
              type: chapter
              description: "Moses and the seventy elders see God; the covenant confirmed."
            - slug: exodus-25
              type: chapter
              description: "Instructions for the ark, table of showbread, and the lampstand."
            - slug: exodus-26
              type: chapter
              description: Instructions for constructing the tabernacle.
            - slug: exodus-27
              type: chapter
              description: "Instructions for the bronze altar, the courtyard, and the lamp oil."
            - slug: exodus-28
              type: chapter
              description: "Aaron's priestly garments — the ephod, breastplate, and robe."
            - slug: exodus-29
              type: chapter
              description: "Consecration of Aaron and his sons as priests."
            - slug: exodus-30
              type: chapter
              description: "The altar of incense; the census tax; the anointing oil."
            - slug: exodus-31
              type: chapter
              description: "Bezalel called to build the tabernacle; Sabbath observance."
            - slug: exodus-32
              type: chapter
              description: "Israel makes a golden calf; Moses intercedes and breaks the tablets."
            - slug: exodus-33
              type: chapter
              description: "Moses seeks to see God's glory; God promises his presence."
            - slug: exodus-34
              type: chapter
              description: "New stone tablets given; the covenant renewed; Moses's face shines."
            - slug: exodus-35
              type: chapter
              description: "Sabbath laws restated; freewill offerings gathered for the tabernacle."
            - slug: exodus-36
              type: chapter
              description: "The tabernacle constructed by Bezalel and Oholiab."
            - slug: exodus-37
              type: chapter
              description: "The ark, table of showbread, and lampstand crafted."
            - slug: exodus-38
              type: chapter
              description: "The bronze altar and the tabernacle courtyard constructed."
            - slug: exodus-39
              type: chapter
              description: "The priestly garments completed and presented to Moses."
            - slug: exodus-40
              type: chapter
              description: "The tabernacle erected and dedicated; the glory of the Lord fills it."

        - slug: leviticus
          type: book
          title: Leviticus
          description: Leviticus records the laws of sacrifice, purity, and holiness given to Israel at Sinai, establishing the patterns of worship for the Levitical priesthood.
          url_template: "https://www.churchofjesuschrist.org/study/scriptures/ot/lev/{index}?lang=eng"
          children:
            - slug: leviticus-1
              type: chapter
              description: Laws for burnt offerings from the herd and flock.
            - slug: leviticus-2
              type: chapter
              description: Laws for grain offerings.
            - slug: leviticus-3
              type: chapter
              description: Laws for peace offerings.
            - slug: leviticus-4
              type: chapter
              description: Laws for sin offerings for unintentional sins.
            - slug: leviticus-5
              type: chapter
              description: "Laws for guilt offerings; confession and restitution."
            - slug: leviticus-6
              type: chapter
              description: "Restitution for wrongs; priestly duties for the altar fire and grain offering."
            - slug: leviticus-7
              type: chapter
              description: Laws for guilt and peace offerings; portions for the priests.
            - slug: leviticus-8
              type: chapter
              description: "Consecration of Aaron and his sons; Moses anoints them."
            - slug: leviticus-9
              type: chapter
              description: "Aaron's first offerings as high priest; the glory of the Lord appears."
            - slug: leviticus-10
              type: chapter
              description: "Nadab and Abihu offer strange fire and die; laws for priests."
            - slug: leviticus-11
              type: chapter
              description: "Clean and unclean animals — dietary laws."
            - slug: leviticus-12
              type: chapter
              description: Laws for purification after childbirth.
            - slug: leviticus-13
              type: chapter
              description: "Laws for diagnosing leprosy and skin diseases."
            - slug: leviticus-14
              type: chapter
              description: "Rituals for cleansing a leper; laws for mildew in houses."
            - slug: leviticus-15
              type: chapter
              description: Laws for bodily discharges and purification.
            - slug: leviticus-16
              type: chapter
              description: "The Day of Atonement — Aaron enters the holy of holies."
            - slug: leviticus-17
              type: chapter
              description: "Sacrifices to be brought to the tabernacle; prohibition on eating blood."
            - slug: leviticus-18
              type: chapter
              description: "Prohibited sexual relationships; Israel to be holy unlike Egypt and Canaan."
            - slug: leviticus-19
              type: chapter
              description: "Various laws of holiness — love your neighbor; be holy as God is holy."
            - slug: leviticus-20
              type: chapter
              description: Penalties for Molech worship and sexual sins.
            - slug: leviticus-21
              type: chapter
              description: Laws of holiness for priests and the high priest.
            - slug: leviticus-22
              type: chapter
              description: "Priests must be clean to eat holy things; acceptable offerings."
            - slug: leviticus-23
              type: chapter
              description: "The appointed feasts — Sabbath, Passover, Firstfruits, Pentecost, Trumpets, Atonement, Tabernacles."
            - slug: leviticus-24
              type: chapter
              description: "The lamp and showbread; blasphemy and the law of retaliation."
            - slug: leviticus-25
              type: chapter
              description: "The sabbatical year and the Year of Jubilee."
            - slug: leviticus-26
              type: chapter
              description: "Blessings for obedience; curses for disobedience; promise of restoration."
            - slug: leviticus-27
              type: chapter
              description: Laws for vows and dedications to the Lord.
