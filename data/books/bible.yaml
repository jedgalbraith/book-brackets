              description: "Nicodemus and the new birth; God so loved the world; John the Baptist's final witness."
            - slug: john-4
              type: chapter
              description: "The woman at the well; the official's son healed at Capernaum (2nd sign)."
            - slug: john-5
              type: chapter
              description: "Healing at the pool of Bethesda (3rd sign); Jesus and the Father; witnesses to Jesus."
            - slug: john-6
              type: chapter
              description: "Feeding the five thousand (4th sign); walking on water; the bread of life discourse."
            - slug: john-7
              type: chapter
              description: "Jesus at the Feast of Tabernacles; controversy over his identity."
            - slug: john-8
              type: chapter
              description: "The woman caught in adultery; 'I am the light of the world'; Abraham's seed."
            - slug: john-9
              type: chapter
              description: "Healing the man born blind (5th sign); the Pharisees interrogate the healed man."
            - slug: john-10
              type: chapter
              description: "The Good Shepherd; 'I am the door'; the Feast of Dedication; 'I and the Father are one.'"
            - slug: john-11
              type: chapter
              description: "The raising of Lazarus (6th sign); the Pharisees plot to kill Jesus."
            - slug: john-12
              type: chapter
              description: "Mary anoints Jesus; the triumphal entry; the voice from heaven; the hour of glory."
            - slug: john-13
              type: chapter
              description: "Jesus washes the disciples' feet; Judas's betrayal foretold; the new commandment."
            - slug: john-14
              type: chapter
              description: "'I am the way, the truth, and the life'; the promised Comforter."
            - slug: john-15
              type: chapter
              description: "The True Vine; remaining in Christ; the world's hatred of disciples."
            - slug: john-16
              type: chapter
              description: "The work of the Holy Ghost; sorrow turned to joy; 'I have overcome the world.'"
            - slug: john-17
              type: chapter
              description: "Jesus's great intercessory prayer for himself, his disciples, and all believers."
            - slug: john-18
              type: chapter
              description: "Betrayal and arrest in Gethsemane; Peter's denial; trial before Annas and Pilate."
            - slug: john-19
              type: chapter
              description: "Trial before Pilate continued; crucifixion and burial of Jesus."
            - slug: john-20
              type: chapter
              description: "The resurrection; Mary Magdalene at the tomb; Jesus appears; Thomas's confession (7th sign)."
            - slug: john-21
              type: chapter
              description: "Jesus appears at the Sea of Galilee; Peter restored; the beloved disciple."
