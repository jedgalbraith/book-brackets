  slug: doctrine-and-covenants
  type: volume
  title: Doctrine and Covenants
  description: >
    The Doctrine and Covenants is a collection of divine revelations and inspired
    declarations given through Joseph Smith and subsequent presidents of The Church
    of Jesus Christ of Latter-day Saints.
  url_template: "https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/{index}?lang=eng"
  children:
    - slug: dc-1
      type: section
      description: "The Lord's preface to the Doctrine and Covenants; a warning voice to the world; the weak and simple to proclaim the gospel."
    - slug: dc-2
      type: section
      description: "Elijah's mission to turn the hearts of fathers and children to each other before the Lord's great day; the priesthood."
    - slug: dc-3
      type: section
      description: "Joseph Smith rebuked after the 116 pages are lost; the Lord's purposes cannot be frustrated; he is restored to his calling."
    - slug: dc-4
      type: section
      description: "A marvelous work is about to come forth; qualifications for missionary service; faith, hope, charity, and love."
    - slug: dc-5
      type: section
      description: "Martin Harris to be a witness of the plates; the gift of translation belongs to Joseph alone; three witnesses to testify."
    - slug: dc-6
      type: section
      description: "Revelation to Oliver Cowdery; the gift of revelation; seek to bring forth and establish Zion; a great and marvelous work."
    - slug: dc-7
      type: section
      description: "A translation of a record written by John; John would tarry on earth until the Second Coming."
    - slug: dc-8
      type: section
      description: "Oliver Cowdery's gift of revelation explained; the spirit of revelation described; Aaron's rod as a type."
    - slug: dc-9
      type: section
      description: "Oliver Cowdery failed to translate because he did not study it out in his mind and ask; he is counseled to wait."
    - slug: dc-10
      type: section
      description: "The Lord's purposes for the Book of Mormon cannot be frustrated; Satan's plan exposed; the 116 pages cannot be retranslated."
