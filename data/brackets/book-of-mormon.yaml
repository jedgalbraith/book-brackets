          - range: "8-15"
            label: Visions of the tree of life and Christ
          - range: "16-18"
            label: Wilderness and ocean journey
          - range: "19-22"
            label: Isaiah and the covenant of Israel

      - slug: locations
        title: Locations
        description: Where the events take place.
        brackets:
          - range: "1-17"
            label: Jerusalem and wilderness
          - range: "18"
            label: Ocean
          - range: "19-22"
            label: Promised Land

      - slug: authors
        title: Authors
        description: Who is speaking or writing each section.
        brackets:
          - range: "1"
            label: From Lehi's record
          - range: "2-22"
            label: Nephi

      - slug: years
        title: Years
        description: Approximate time period of the events.
        brackets:
          - range: "1-16"
            label: "~600–592 B.C."
          - range: "17-18"
            label: "~592–589 B.C."
          - range: "19-22"
            label: "~589 B.C."

