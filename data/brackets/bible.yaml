schema_version: "1"
title: Bible — Thematic Analysis
book_slug: bible
targets:
  - target_slug: genesis
    topics:
      - slug: narratives
        title: Narratives
        description: The major narrative cycles of Genesis.
        brackets:
          - range: "1-11"
            label: Primeval history
          - range: "12-25"
            label: Abraham
          - range: "25-36"
            label: Isaac and Jacob
          - range: "37-50"
            label: Joseph

      - slug: key-figures
        title: Key Figures
        description: Chapters centered on each patriarch.
        brackets:
          - range: "1-5"
            label: Adam and Eve
          - range: "6-10"
            label: Noah
          - range: "11-25"
            label: Abraham
          - range: "25-36"
            label: Jacob
          - range: "37-50"
            label: Joseph

      - slug: covenants
        title: Covenants
        description: The progressive unfolding of God's covenant.
        brackets:
          - range: "1-3"
            label: Creation and the fall
          - range: "6-9"
            label: Covenant with Noah
          - range: "12-17"
            label: Abrahamic covenant established
          - range: "18-25"
            label: Promise of Isaac fulfilled
          - range: "26-36"
            label: Covenant renewed with Isaac and Jacob
          - range: "37-50"
            label: Providence over Joseph

      - slug: years
        title: Years
        description: Approximate chronological timeline of Genesis.
        brackets:
          - range: "1-11"
            label: Pre-Abrahamic (creation through ~2100 BC)
          - range: "12-24"
            label: ~2100–1900 BC (Abraham)
          - range: "25-36"
            label: ~1900–1700 BC (Isaac and Jacob)
          - range: "37-50"
            label: ~1700–1600 BC (Joseph in Egypt)

  - target_slug: exodus
    topics:
      - slug: phases
        title: Phases
        description: The major phases of the Exodus narrative.
        brackets:
          - range: "1-12"
            label: Plagues and Passover
          - range: "13-18"
            label: Journey to Sinai
          - range: "19-24"
            label: The law at Sinai
          - range: "25-40"
            label: Tabernacle

      - slug: key-events
        title: Key Events
        description: Pivotal moments in Israel's deliverance.
        brackets:
          - range: "1-4"
            label: Moses's call
          - range: "5-11"
            label: The ten plagues
          - range: "12-15"
            label: Passover and Red Sea
          - range: "16-18"
            label: Wilderness provision
          - range: "19-24"
            label: Sinai covenant
          - range: "32-34"
            label: The golden calf and renewal

      - slug: locations
        title: Locations
        description: Where the events take place.
        brackets:
          - range: "1-15"
            label: Egypt
          - range: "16-18"
            label: Wilderness of Sinai
          - range: "19-40"
            label: Mount Sinai

      - slug: years
        title: Years
        description: Approximate chronological timeline of Exodus.
        brackets:
          - range: "1-2"
            label: ~1526–1446 BC (Israel in bondage)
          - range: "3-12"
            label: ~1446 BC (Moses's call and the plagues)
          - range: "13-18"
            label: ~1446 BC (from Egypt to Sinai)
          - range: "19-40"
            label: ~1446–1445 BC (at Sinai)

  - target_slug: gospels-overview
    drills_into:
      - matthew
      - mark
      - luke
      - john
    topics:
      - slug: gospel-tradition
        title: Gospel Tradition
        description: Synoptic vs. Johannine tradition.
        brackets:
          - range: "1-3"
            label: Synoptic Gospels
          - range: "4"
            label: Johannine Gospel

      - slug: primary-audience
        title: Primary Audience
        description: The intended original readership of each Gospel.
        brackets:
          - range: "1"
            label: Jewish Christians
          - range: "2"
            label: Gentile (Roman)
          - range: "3"
            label: Gentile (Greek)
          - range: "4"
            label: Universal

      - slug: christological-portrait
        title: Christological Portrait
        description: How each Gospel presents the identity of Jesus.
        brackets:
          - range: "1"
            label: Messiah and King
          - range: "2"
            label: Suffering Servant
          - range: "3"
            label: Son of Man
          - range: "4"
            label: Son of God

      - slug: years
        title: Years
        description: Approximate dates of Gospel composition.
        brackets:
          - range: "2"
            label: ~AD 65 (Mark)
          - range: "1"
            label: ~AD 70 (Matthew)
          - range: "3"
            label: ~AD 80 (Luke)
          - range: "4"
            label: ~AD 95 (John)

  - target_slug: matthew
    topics:
      - slug: ministry-phase
        title: Ministry Phase
        description: The major phases of Jesus's ministry in Matthew.
        brackets:
          - range: "1-4"
            label: Birth and preparation
          - range: "5-13"
            label: Kingdom proclaimed and taught
          - range: "14-25"
            label: Ministry, controversy, and eschatology
          - range: "26-28"
            label: Passion and resurrection

      - slug: themes
        title: Themes
        description: Major thematic movements in Matthew.
        brackets:
          - range: "1-12"
            label: The King arrives and demonstrates authority
          - range: "13-20"
            label: Parables, faith, and discipleship
          - range: "21-28"
            label: Confrontation, judgment, and triumph

      - slug: locations
        title: Locations
        description: Where the events of Matthew take place.
        brackets:
          - range: "1-4"
            label: Bethlehem, Egypt, Nazareth, Jordan
          - range: "5-20"
            label: Galilee
          - range: "21-28"
            label: Jerusalem

      - slug: years
        title: Years
        description: Approximate timeline of events in Matthew.
        brackets:
          - range: "1-2"
            label: ~6–4 BC (birth and infancy)
          - range: "3-4"
            label: ~AD 26–27 (beginning of ministry)
          - range: "5-18"
            label: ~AD 27–29 (Galilean ministry)
          - range: "19-20"
            label: ~AD 29–30 (journey to Jerusalem)
          - range: "21-28"
            label: ~AD 30 (Passion Week and resurrection)

  - target_slug: mark
    topics:
      - slug: ministry-phase
        title: Ministry Phase
        description: The major phases of Jesus's ministry in Mark.
        brackets:
          - range: "1-8"
            label: Galilean ministry
          - range: "9-10"
            label: Journey toward Jerusalem
          - range: "11-16"
            label: Jerusalem and passion

      - slug: themes
        title: Themes
        description: Major thematic movements in Mark.
        brackets:
          - range: "1-8"
            label: The Servant acts with power and authority
          - range: "9-13"
            label: Teaching on discipleship and the future
          - range: "14-16"
            label: Suffering, death, and resurrection

      - slug: locations
        title: Locations
        description: Where the events of Mark take place.
        brackets:
          - range: "1-9"
            label: Galilee and surrounding regions
          - range: "10"
            label: On the road through Perea
          - range: "11-16"
            label: Jerusalem

      - slug: years
        title: Years
        description: Approximate timeline of events in Mark.
        brackets:
          - range: "1"
            label: ~AD 26–27 (beginning of ministry)
          - range: "2-9"
            label: ~AD 27–29 (Galilean ministry)
          - range: "10"
            label: ~AD 29–30 (journey to Jerusalem)
          - range: "11-16"
            label: ~AD 30 (Jerusalem and passion)

  - target_slug: luke
    topics:
      - slug: ministry-phase
        title: Ministry Phase
        description: The major phases of Jesus's ministry in Luke.
        brackets:
          - range: "1-4"
            label: Birth and preparation
          - range: "5-9"
            label: Galilean ministry
          - range: "10-19"
            label: Journey to Jerusalem
          - range: "20-24"
            label: Jerusalem and resurrection

      - slug: themes
        title: Themes
        description: Major thematic movements in Luke.
        brackets:
          - range: "1-9"
            label: The Savior comes for the poor and outcast
          - range: "10-19"
            label: Teaching on discipleship and prayer
          - range: "20-24"
            label: The kingdom and the cross

      - slug: locations
        title: Locations
        description: Where the events of Luke take place.
        brackets:
          - range: "1-4"
            label: Judea and Galilee
          - range: "5-9"
            label: Galilee
          - range: "10-18"
            label: The road to Jerusalem
          - range: "19-24"
            label: Jerusalem

      - slug: years
        title: Years
        description: Approximate timeline of events in Luke.
        brackets:
          - range: "1-2"
            label: ~6–4 BC (birth narratives)
          - range: "3-4"
            label: ~AD 26–27 (beginning of ministry)
          - range: "5-9"
            label: ~AD 27–29 (Galilean ministry)
          - range: "10-19"
            label: ~AD 29–30 (journey to Jerusalem)
          - range: "20-24"
            label: ~AD 30 (Jerusalem and passion)

  - target_slug: john
    topics:
      - slug: ministry-phase
        title: Ministry Phase
        description: The major structural divisions of John's Gospel.
        brackets:
          - range: "1-12"
            label: Book of Signs (public ministry)
          - range: "13-17"
            label: Book of Glory (upper room)
          - range: "18-21"
            label: Passion and resurrection

      - slug: themes
        title: Themes
        description: Major thematic movements in John.
        brackets:
          - range: "1-12"
            label: Signs and "I AM" declarations
          - range: "13-17"
            label: Love, the Comforter, and union with Christ
          - range: "18-21"
            label: Sacrifice and resurrection life

      - slug: locations
        title: Locations
        description: Where the events of John take place.
        brackets:
          - range: "1-4"
            label: Judea, Samaria, and Galilee
          - range: "5-12"
            label: Jerusalem (repeated festival visits)
          - range: "13-20"
            label: Jerusalem (upper room through resurrection)
          - range: "21"
            label: Sea of Galilee

      - slug: seven-signs
        title: Seven Signs
        description: The seven miraculous signs John records as evidence of Jesus's divine identity.
        brackets:
          - range: "2"
            label: Water to wine at Cana
          - range: "4"
            label: Official's son healed
          - range: "5"
            label: Man at Bethesda healed
          - range: "6"
            label: Feeding the five thousand
          - range: "9"
            label: Man born blind healed
          - range: "11"
            label: Lazarus raised
          - range: "20"
            label: Resurrection appearances

      - slug: years
        title: Years
        description: Approximate timeline of events in John.
        brackets:
          - range: "1-4"
            label: ~AD 26–27 (early ministry, Judea and Samaria)
          - range: "5-12"
            label: ~AD 27–29 (Jerusalem feasts and controversies)
          - range: "13-17"
            label: ~AD 30 (upper room, night of betrayal)
          - range: "18-21"
            label: ~AD 30 (passion and resurrection)