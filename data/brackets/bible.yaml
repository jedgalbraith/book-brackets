schema_version: "1"
author: "AI: Claude"
title: Bible — Thematic Analysis
book_slug: bible
targets:
  - target_slug: genesis
    default_right: years
    topics:
      - slug: narratives
        title: Narratives
        description: The major narrative cycles of Genesis.
        brackets:
          - range: "1-11"
            label: Primeval history
          - range: "12-25"
            label: Abraham
          - range: "25-36"
            label: Isaac and Jacob
          - range: "37-50"
            label: Joseph

      - slug: key-figures
        title: Key Figures
        description: Chapters centered on each patriarch.
        brackets:
          - range: "1-5"
            label: Adam and Eve
          - range: "6-10"
            label: Noah
          - range: "11-25"
            label: Abraham
          - range: "25-36"
            label: Jacob
          - range: "37-50"
            label: Joseph

      - slug: themes
        title: Themes
        description: Major theological movements through Genesis.
        brackets:
          - range: "1-11"
            label: Creation, fall, and human corruption
          - range: "12-25"
            label: "Call, covenant, and faith of Abraham"
          - range: "26-36"
            label: Covenant carried through Isaac and Jacob
          - range: "37-50"
            label: Providence and redemption through Joseph

      - slug: key-events
        title: Key Events
        description: Pivotal moments in the Genesis narrative.
        brackets:
          - range: "1-3"
            label: Creation and the fall
          - range: "6-9"
            label: "The flood — Noah's covenant"
          - range: "11"
            label: The tower of Babel
          - range: "12-15"
            label: "Abram called; covenant established"
          - range: "22"
            label: The sacrifice of Isaac
          - range: "28"
            label: Jacob's vision at Bethel
          - range: "37-45"
            label: "Joseph sold, tested, and revealed"

      - slug: covenants
        title: Covenants
        description: The progressive unfolding of God's covenant.
        brackets:
          - range: "1-3"
            label: Creation and the fall
          - range: "6-9"
            label: Covenant with Noah
          - range: "12-17"
            label: Abrahamic covenant established
          - range: "18-25"
            label: Promise of Isaac fulfilled
          - range: "26-36"
            label: Covenant renewed with Isaac and Jacob
          - range: "37-50"
            label: Providence over Joseph

      - slug: years
        title: Years
        description: Approximate chronological timeline of Genesis.
        brackets:
          - range: "1-11"
            label: Pre-Abrahamic (creation to ~2100 BC)
          - range: "12-24"
            label: ~2100–1900 BC (Abraham)
          - range: "25-36"
            label: ~1900–1700 BC (Isaac and Jacob)
          - range: "37-50"
            label: ~1700–1600 BC (Joseph in Egypt)

      - slug: come-follow-me
        title: Come, Follow Me 2026
        description: Weekly Come, Follow Me 2026 lesson assignments for Genesis.
        brackets:
          - range: "1-2"
            label: "Week 3 · Jan 12–18"
          - range: "3-4"
            label: "Week 4 · Jan 19–25"
          - range: "5"
            label: "Week 5 · Jan 26–Feb 1"
          - range: "6-11"
            label: "Week 7 · Feb 9–15"
          - range: "12-17"
            label: "Week 8 · Feb 16–22"
          - range: "18-23"
            label: "Week 9 · Feb 23–Mar 1"
          - range: "24-33"
            label: "Week 10 · Mar 2–8"
          - range: "37-41"
            label: "Week 11 · Mar 9–15"
          - range: "42-50"
            label: "Week 12 · Mar 16–22"

