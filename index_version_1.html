<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scripture Chapters Visualization</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    .chapter {
      cursor: pointer;
    }
    .bracket {
      stroke: black;
      fill: none;
    }
    .bracket-label {
      font-weight: bold;
      fill: black;
    }
    .button {
      margin: 5px;
      padding: 5px;
      cursor: pointer;
      background-color: #ddd;
      border: 1px solid #aaa;
    }
    .button:hover {
      background-color: #ccc;
    }
    .button.active {
      background-color: #bbb;
    }
  </style>
</head>
<body>
<button class="level-btn button" value="1">Records</button>
<button class="level-btn button" value="2">Events</button>
<button class="level-btn button" value="3">Speakers</button>
<button class="level-btn button" value="4">Topics</button>
<button class="level-btn button" value="5">Locations</button>

<div id="chart"></div>

          { "chapter": 62, "desc": "Moroni marches to aid Pahoran", "years": "61 B.C." },

  const width = 1200;
  const height = 1500;
  const centerX = width / 2;

  const svg = d3.select("#chart")
    .append("svg")
    .attr("width", width)
    .attr("height", height);

  const chapters = d3.range(1, data["Book of Mormon"]["Alma"]["chapters"] + 1);

  const descriptions = data["Book of Mormon"]["Alma"]["descriptions"].reduce((acc, val) => {
    acc[val.chapter] = val.desc;
    return acc;
  }, {});

  const yearRanges = data["Book of Mormon"]["Alma"]["descriptions"].reduce((acc, val) => {
    acc[val.chapter] = val.years;
    return acc;
  }, {});

  svg.selectAll(".chapter")
    .data(chapters)
    .enter()
    .append("text")
    .attr("class", "chapter")
    .attr("x", centerX)  // Centered X coordinate
    .attr("y", (d, i) => i * 20 + 20)
    .attr("text-anchor", "middle")  // Align text to the middle
    .text(d => d)
    .on("click", (event, d) => {
      window.location.href = `https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/${d}?lang=eng`;
    });

  svg.selectAll(".description")
    .data(chapters)
    .enter()
    .append("text")
    .attr("class", "description")
    .attr("x", centerX + 30)  // Adjusted x coordinate for descriptions
    .attr("y", (d, i) => i * 20 + 20)
    .text(d => descriptions[d] || "");

  svg.selectAll(".year-range")
    .data(chapters)
    .enter()
    .append("text")
    .attr("class", "year-range")
    .attr("x", centerX + 400)  // Adjusted x coordinate for year ranges
    .attr("y", (d, i) => i * 20 + 20)
    .text(d => yearRanges[d] || "");

  function clearBrackets() {
    svg.selectAll('.bracket').remove();
    svg.selectAll('.bracket-label').remove();
  }

  function drawTopic(topic) {
    let [start, end] = topic.range.split('-').map(Number);
    end = end || start;
    let yStart = (start - 1) * 20 + 10;
    let yEnd = (end - 1) * 20 + 30;
    const bracketShift = 35;
    const bracketDepth = 20;

    svg.append("line")
      .attr("class", "bracket level-bracket")
      .attr("x1", centerX - bracketShift)
      .attr("x2", centerX - bracketShift)
      .attr("y1", yStart)
      .attr("y2", yEnd);

    svg.append("line")
      .attr("class", "bracket")
      .attr("x1", centerX - bracketShift)
      .attr("x2", centerX - bracketShift + bracketDepth)
      .attr("y1", yStart)
      .attr("y2", yStart);

    svg.append("line")
      .attr("class", "bracket")
      .attr("x1", centerX - bracketShift)
      .attr("x2", centerX - bracketShift + bracketDepth)
      .attr("y1", yEnd)
      .attr("y2", yEnd);

    svg.append("text")
      .attr("class", "bracket-label")
      .attr("x", centerX - bracketShift - 25)
      .attr("y", (yStart + yEnd) / 2)
      .attr("dy", ".35em")
      .attr("text-anchor", "end")
      .text(topic.title);
  }

  function drawLevel(level) {
    clearBrackets();

    // If All is selected, show all topics. Otherwise, only show the topics from the selected level
    const displayedTopics = data["Book of Mormon"]["Alma"]["topics"].filter(t => t.level === level);

    displayedTopics.forEach(drawTopic);
  }

  window.onload = function() {
    // Add click event listener to all buttons with class 'level-btn'
    document.querySelectorAll('.level-btn').forEach(button => {
      button.addEventListener('click', function() {
        const selectedLevel = parseInt(this.value);
        drawLevel(selectedLevel);
      });
    });

    // Automatically click the Level 1 button when the page loads
    document.querySelector('button[value="1"]').click();
  };

</script>
</body>
</html>
